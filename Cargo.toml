[package]
name = "gerfaut-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
description = "Core library of Gerfaut, a Bitcoin watch-only wallet"
repository = "https://github.com/gerfaut-wallet/gerfaut-core"
license = "AGPL-3.0-only"
publish = false

[features]
# No Tor client is built in by default: a consumer asks for one. Both
# apps do: a phone rarely runs a Tor daemon and Orbot is a second app
# to install, and a desktop user should not have to install Tor to
# read a .onion backend either.
default = []
# A Tor client built into the library, so .onion backends work on a
# device with no Tor daemon. Off, .onion hosts still work through a
# system Tor.
embedded-tor = ["dep:arti-client", "dep:tor-rtcompat", "dep:futures-util"]

[dependencies]
bdk_wallet = "3.1"
bdk_esplora = { version = "0.22", default-features = false, features = ["async-https-rustls", "tokio"] }
bdk_electrum = { version = "0.24", default-features = false, features = ["use-rustls-ring"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
# Direct, so Electrum connections can carry their own certificate
# verifier; the same version and provider `bdk_electrum` pulls in.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
# Reads a certificate the way it was written: its fingerprint's
# subject and expiry for the acceptance dialog, and its public key
# when the certificate predates X.509 v3 and webpki declines it.
x509-parser = { version = "0.18", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "macros", "sync", "time", "net", "io-util"] }
chacha20poly1305 = "0.10"
argon2 = "0.5"
rand = "0.9"
zeroize = { version = "1", features = ["derive"] }
# Constant-time comparison of the app lock hash.
subtle = "2"
uuid = { version = "1", features = ["v4", "serde"] }
ur = "0.5"
ciborium = "0.2"
flate2 = "1"
data-encoding = "2"
# Embedded Tor. The rustls runtime keeps the tree free of OpenSSL, the
# bundled sqlite keeps it free of system libraries, and the onion
# service client is what a .onion backend needs.
arti-client = { version = "0.45", default-features = false, features = ["tokio", "rustls", "compression", "flowctl-cc", "onion-service-client", "vanguards", "static-sqlite"], optional = true }
tor-rtcompat = { version = "0.45", default-features = false, features = ["tokio", "rustls"], optional = true }
futures-util = { version = "0.3", default-features = false, optional = true }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

# arti pulls in `saturating-time`, whose limit search never terminates
# on a clock coarser than a nanosecond: Windows counts 100 ns intervals,
# so adding 1 ns returns the same value and the loop takes that for
# progress (arti #2678). The fork pins the three-line fix; drop it once
# a release carries one. Every manifest that builds this crate needs the
# same section: Cargo only honours [patch] in the root manifest.
[patch.crates-io]
saturating-time = { git = "https://github.com/gerfaut-wallet/saturating-time", rev = "7bef6ba00f3adaa6aff7e68966614c9d55bb60ec" }
