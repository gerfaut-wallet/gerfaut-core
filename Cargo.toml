[package]
name = "gerfaut-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "Core library of Gerfaut, a Bitcoin watch-only wallet"
repository = "https://github.com/gerfaut-wallet/gerfaut-core"
license = "AGPL-3.0-only"
publish = false

[dependencies]
bdk_wallet = "3.1"
bdk_esplora = { version = "0.22", default-features = false, features = ["async-https-rustls", "tokio"] }
bdk_electrum = { version = "0.24", default-features = false, features = ["use-rustls-ring"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
# Direct, so Electrum connections can carry their own certificate
# verifier; the same version and provider `bdk_electrum` pulls in.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
# Reads a certificate the way it was written: its fingerprint's
# subject and expiry for the acceptance dialog, and its public key
# when the certificate predates X.509 v3 and webpki declines it.
x509-parser = { version = "0.18", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }
chacha20poly1305 = "0.10"
argon2 = "0.5"
rand = "0.9"
zeroize = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4", "serde"] }
ur = "0.5"
ciborium = "0.2"
flate2 = "1"
data-encoding = "2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
