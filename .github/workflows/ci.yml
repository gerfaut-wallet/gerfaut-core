name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Whether the jobs that compile have anything to check. On a pull
  # request whose files are all documentation, listed below, they are
  # skipped, and a skipped job counts as passed. Any other path, a push to
  # main and a manual run, run them all.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.paths.outputs.code }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The merge commit of the pull request and its first parent, the
          # base branch: the diff between them is what the merge changes.
          fetch-depth: 2
          persist-credentials: false
      - name: Read the changed paths
        id: paths
        env:
          EVENT: ${{ github.event_name }}
        run: |
          code=true
          if [ "$EVENT" = pull_request ]; then
            paths=$(git -c core.quotePath=false diff --name-only --no-renames HEAD^1 HEAD)
            [ -z "$paths" ] || code=false
            while IFS= read -r path; do
              case "$path" in
                README.md | CONTRIBUTING.md | SECURITY.md | TRADEMARK.md) ;;
                LICENSE | .github/PULL_REQUEST_TEMPLATE.md) ;;
                .github/ISSUE_TEMPLATE/*.yml | .github/ISSUE_TEMPLATE/*.md) ;;
                .github/images/*.svg | .github/images/*.webp) ;;
                .github/images/*.png | CHANGELOG.md) ;;
                *) code=true ;;
              esac
            done <<<"$paths"
          fi
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"

  test:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Check formatting
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test

      # Cargo only warns when a [patch] no longer matches what the
      # dependencies ask for, and records it in Cargo.lock: the fork of
      # saturating-time would stop applying, and the Windows hang it
      # fixes would come back, with every other step green.
      - name: Check that every patch applies
        run: if grep -n '^\[\[patch.unused\]\]' Cargo.lock; then exit 1; fi

  # Both apps ship with the Tor client compiled in, and nothing above
  # builds that code. Checking it here keeps the shipped configuration
  # honest without paying for a full arti test run on every push.
  embedded-tor:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: embedded-tor
      - name: Lint with the Tor client built in
        run: cargo clippy --all-targets --features embedded-tor -- -D warnings

  # The code behind #[cfg(windows)], which no Linux job compiles: the
  # desktop ships it. ring and secp256k1-sys compile C for
  # the target, so a check from Linux would need a MinGW toolchain;
  # this runs on Windows itself, for the MSVC target the desktop builds.
  windows:
    runs-on: windows-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: windows
      - name: Lint for Windows
        run: cargo clippy --all-targets -- -D warnings
