name: Dependencies

# Known advisories, licenses and sources of the crates in Cargo.lock,
# checked by cargo-deny against deny.toml: on every push to main, every
# pull request, every Monday, and on demand (Actions, Dependencies, Run
# workflow). The weekly run is the one that catches an advisory published
# while nothing here changed; when it fails, GitHub notifies whoever last
# edited the cron line below.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-deny:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # One version, checked against the hash of its release archive: a
      # new release changes nothing until it changes here.
      CARGO_DENY_VERSION: 0.20.2
      CARGO_DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install cargo-deny
        run: |
          name="cargo-deny-$CARGO_DENY_VERSION-x86_64-unknown-linux-musl"
          curl -fsSL --retry 3 --retry-all-errors -o "$RUNNER_TEMP/$name.tar.gz" "https://github.com/EmbarkStudios/cargo-deny/releases/download/$CARGO_DENY_VERSION/$name.tar.gz"
          echo "$CARGO_DENY_SHA256  $RUNNER_TEMP/$name.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$name.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$name" >> "$GITHUB_PATH"
      - name: Install pinned toolchain
        run: rustup toolchain install
      # Fetches the RustSec advisory database at every run.
      - name: Check advisories, licenses and sources
        run: cargo deny --locked check advisories licenses sources
